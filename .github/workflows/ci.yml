name: CI

# The gate for pull requests. These three pages have no build step; the only check is
# the brand-and-claim check (luvita-docs#9): the Luvita attribution line on every page,
# the holder never a person or a bare brand, LexiPower never "WordPower". Rules and
# reasons live in brand-rules.json; the script is vendored from
# project-templates/actions/brand-claim-check. The same check runs locally as the
# optional .githooks/pre-push. The accessibility check (ADR 0011 §5.1/§5.3) runs axe-core
# on every page; exceptions live in .github/a11y/allowlist.json, each with a reason.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Brand and claim check
        run: python3 .github/scripts/brand-check.py --rules brand-rules.json
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install accessibility tooling
        run: npm install --prefix "$RUNNER_TEMP/a11y" --no-save --no-audit --no-fund puppeteer@24 axe-core@4.11.4
      - name: Accessibility check (axe-core, WCAG 2.2 AA)
        run: node .github/a11y/axe-check.mjs
        env:
          NODE_PATH: ${{ runner.temp }}/a11y/node_modules
